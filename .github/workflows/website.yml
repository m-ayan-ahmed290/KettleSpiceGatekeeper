name: Build and publish website ZIPs
on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', '.github/workflows/website.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm audit --audit-level=low
      - run: npm run build
      - run: npm run typecheck
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: gatekeeper-website
          path: website/dist/*
      - name: Publish website downloads
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="website-v$(node -p 'require("./package.json").version')"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release already exists; use this run's tested artifacts or bump the website version."
          else
            gh release create "$VERSION" dist/* --target "$GITHUB_SHA" --latest=false --title "Gatekeeper website — $VERSION" --notes-file README.md
          fi
